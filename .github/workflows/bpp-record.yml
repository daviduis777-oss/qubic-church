# BPP-9000 record: twice an hour, ask the site to seal the current hour's call and check closed hours.
# The endpoint is public and idempotent, so this needs no secret; a late or doubled run changes nothing.
name: BPP-9000 record

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Tick
        run: curl -fsS --max-time 60 -X POST https://qubic.church/api/bpp/tick
      - name: Brain Watch shelf
        # the epoch's best brains onto the archive shelf; also public and idempotent
        run: curl -fsS --max-time 90 -X POST https://qubic.church/api/bpp/brains/tick || true
      - name: Network status
        # one look at the Qubic tick, so a stall is noticed even when nobody has /status open
        run: curl -fsS --max-time 30 -X POST https://qubic.church/api/network/status || true
      - name: The field
        # the garden's field: a few dozen computors' records per call, two calls per run; public and idempotent
        run: for i in 1 2; do curl -fsS --max-time 60 -X POST https://qubic.church/api/garden/field/tick || true; sleep 20; done

<title>W4W Aigarth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Big+Shoulders+Display:wght@400;600;800&family=Michroma&display=swap" rel="stylesheet">
<style>
/* A night town seen from above: amber light against blue frost. One display face, one body face, one wide label face. */
:root{
  --bg:#0B0A0E; --panel:rgba(14,12,18,.88); --line:rgba(255,196,107,.22); --line-2:rgba(255,196,107,.45);
  --amber:#E8912E; --gold:#FFC46B; --cream:#FFE3B0; --ink:#F3E4CE; --mute:rgba(243,228,206,.62);
  --frost:#9fc3ff; --red:#ff6a5a; --green:#9be08a;
  --f-display:'Big Shoulders Display',Impact,sans-serif; --f-body:Archivo,system-ui,sans-serif; --f-label:Michroma,'Arial Black',sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
#snow2d{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
.mute{color:var(--mute)}
[hidden]{display:none!important}

#top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));padding-top:max(12px,env(safe-area-inset-top));pointer-events:none;background:linear-gradient(rgba(11,10,14,.85),rgba(11,10,14,0))}
#top > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--f-label);font-size:13px;letter-spacing:.14em;font-weight:400;color:var(--cream);white-space:nowrap}
.pilot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--amber),0 0 22px var(--amber);flex-shrink:0}
.chips{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{display:flex;align-items:center;gap:8px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;white-space:nowrap}
.chip b{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--gold);letter-spacing:.03em}
button.chip:hover{border-color:var(--line-2)}

/* the one bold element: warmth against frost */
#meter{position:fixed;top:max(58px,calc(env(safe-area-inset-top) + 50px));left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 32px));padding:8px 12px 9px;border:1px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;text-align:left}
#meter:hover{border-color:var(--line-2)}
#meter .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#meter .w,#meter .f{font-family:var(--f-label);font-size:9.5px;letter-spacing:.14em}
#meter .w{color:var(--gold)} #meter .f{color:var(--frost)}
#meter .verdict{font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--cream);letter-spacing:.02em}
#meter .track{position:relative;height:8px;border-radius:4px;margin-top:6px;background:linear-gradient(90deg,rgba(255,170,80,.18),rgba(159,195,255,.18));overflow:hidden}
#meter .track i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#c9701d,#ffc46b);transition:width .8s}
#meter .track b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--frost);box-shadow:0 0 6px var(--frost);transition:left .8s}
#meter.losing{border-color:rgba(159,195,255,.5)}
#meter.losing .verdict{color:var(--frost)}

#diag{position:fixed;z-index:9;left:12px;top:56px;margin:0;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:rgba(5,7,14,.88);color:#cfe6ff;font:12px/1.5 ui-monospace,monospace;white-space:pre;pointer-events:none}
#dock button.journal{color:var(--gold);box-shadow:inset 0 0 0 1px rgba(255,196,107,.45);background:rgba(255,196,107,.08)}
#dock button.journal svg{stroke:var(--gold)}
.jtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 12px;padding:4px;border:1px solid var(--line);border-radius:12px}
.jtabs button{padding:9px;border:0;border-radius:9px;background:none;color:var(--ink);font:inherit;font-family:var(--f-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.jtabs button.on{background:rgba(255,196,107,.16);color:var(--cream)}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.jstat{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}
.jstat i{display:block;font-style:normal;font-family:var(--f-label);font-size:9px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.jstat b{display:block;margin:3px 0 1px;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.05;color:var(--cream)}
.jstat span{font-size:12px;color:var(--mute)}
.jstat.good{border-color:rgba(155,224,138,.35)} .jstat.bad{border-color:rgba(255,106,90,.4)}
#panel .faq-g{margin:16px 0 4px}
#panel .faq-g:first-child{margin-top:0}
#panel .faq{border-bottom:1px solid var(--line);padding:2px 0}
#panel .faq summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.25;color:var(--cream);padding:8px 0}
#panel .faq[open] summary{color:var(--gold)}
#panel .faq p,#panel .faq li{font-size:14px;line-height:1.55;color:var(--ink);margin:0 0 10px}
#panel .faq ol{margin:0 0 12px;padding-left:20px}
#panel .faq li{margin-bottom:6px}
#panel .faq-now{padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
#panel .faq-now.bad{border-color:rgba(255,120,90,.5);background:rgba(255,120,90,.08)}
#panel .faq-now.good{border-color:rgba(120,220,160,.4);background:rgba(120,220,160,.06)}
#panel .faq-addr{display:inline-flex;align-items:center;gap:8px;margin-top:4px}
#panel .faq-addr code{padding:3px 8px;border-radius:6px;background:#05070e;border:1px solid var(--line);font:12.5px ui-monospace,monospace;color:var(--gold)}
#panel .faq-addr .btn{padding:3px 9px;font-size:12px}
#panel .faq-small{font-size:12.5px;color:var(--mute)}
/* Maria's dialogue box outside the prologue */
#talk{position:fixed;inset:0;z-index:6;display:flex;align-items:flex-end;justify-content:center;padding:0 max(16px,env(safe-area-inset-right)) max(28px,calc(env(safe-area-inset-bottom) + 20px)) max(16px,env(safe-area-inset-left));background:linear-gradient(rgba(5,7,14,0),rgba(5,7,14,.7) 75%);pointer-events:none}
#talk .card{pointer-events:auto;position:relative;width:min(940px,100%);min-height:220px;max-height:calc(100vh - 60px);padding:22px 26px 18px calc(min(58vh,470px) * .714 + 4px);border:1px solid rgba(232,176,92,.42);border-radius:16px;background:linear-gradient(rgba(12,15,26,.94),rgba(8,10,18,.97));box-shadow:0 18px 60px rgba(0,0,0,.55)}
#talk .card>img{position:absolute;left:-18px;bottom:0;height:min(58vh,470px);width:auto;pointer-events:none;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
#talk .card>div{position:relative;max-height:calc(100vh - 100px);overflow:auto}
#talk .who{display:inline-block;padding:5px 12px;border:1px solid rgba(232,176,92,.5);border-radius:8px;background:#0d1020;font-family:var(--f-label);font-size:11px;letter-spacing:.16em;color:var(--gold)}
#talk #talkText{margin:12px 0 12px;font-family:var(--f-display);font-weight:600;font-size:clamp(20px,2.3vw,27px);line-height:1.18;color:var(--cream);text-wrap:pretty;cursor:default}
#talk .row{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:12px}
#talk .row .btn:first-child{margin-right:auto}
#talk .name{width:100%;margin:2px 0 4px}
#talk .mono,#hub code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em}
.terr{margin:4px 0 0;font-size:13.5px;color:#ffb4a6}
.tnote{display:block;margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--mute)}
.tnote a,.hcard a:not(.btn){color:var(--gold)}
.mchips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.mchips span{display:inline-flex;flex-direction:column;gap:1px;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:rgba(255,196,107,.04);font-size:14px;color:var(--cream)}
.mchips i{font-style:normal;font-family:var(--f-label);font-size:9px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.isteps{margin:6px 0 0;padding-left:22px;display:grid;gap:12px}
.isteps li{font-size:14.5px;line-height:1.5;color:var(--ink)}
.isteps li b{color:var(--cream)}
.isteps .btn{margin-top:8px;display:flex;width:fit-content}
.crow{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.crow i{font-style:normal;min-width:96px;font-family:var(--f-label);font-size:9.5px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.crow code{padding:5px 9px;border-radius:7px;background:#05070e;border:1px solid var(--line);font-size:13px;color:var(--gold);word-break:break-all;max-width:100%}
.crow .btn{padding:4px 10px;font-size:12px}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin:10px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,196,107,.03)}
.rules b{grid-column:1/-1;font-family:var(--f-label);font-size:10px;letter-spacing:.14em;color:var(--gold);font-weight:400}
.rules span{font-size:13.5px;color:var(--ink);padding-left:14px;position:relative}
.rules span::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--amber)}
/* the Mine */
#hub{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;padding:64px max(16px,env(safe-area-inset-right)) 96px max(16px,env(safe-area-inset-left));background:rgba(5,7,14,.62)}
body.hub #dock button.main{background:rgba(255,196,107,.16)}
.hub-win{width:min(1180px,100%);height:min(860px,100%);display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;border:1px solid rgba(232,176,92,.42);border-radius:18px;overflow:hidden;background:radial-gradient(120% 80% at 100% 0%,rgba(232,145,46,.10),transparent 60%),linear-gradient(rgba(12,15,26,.97),rgba(8,10,18,.98));box-shadow:0 24px 80px rgba(0,0,0,.6)}
.hub-win header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px 24px 16px;border-bottom:1px solid var(--line)}
.hub-win header .who{font-family:var(--f-label);font-size:10.5px;letter-spacing:.16em;color:var(--gold)}
.hub-win header h2{margin:6px 0 2px;font-family:var(--f-display);font-weight:700;font-size:44px;line-height:.95;letter-spacing:.01em;color:var(--cream)}
.hub-win header p{margin:0;color:var(--mute);font-size:14px}
.hub-win nav{display:flex;flex-direction:column;gap:2px;padding:12px 10px;border-right:1px solid var(--line);overflow:auto}
.hub-win nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:10px;background:none;color:var(--ink);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.hub-win nav button svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.hub-win nav button:hover{background:rgba(255,196,107,.07)}
.hub-win nav button.on{background:rgba(255,196,107,.13);color:var(--cream);box-shadow:inset 2px 0 0 var(--amber)}
.hub-win nav button:focus-visible,.hub-win .x:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
#hubBody{overflow:auto;padding:20px 24px 26px;display:flex;flex-direction:column;gap:14px}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.hcard{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02)}
.hcard p{margin:6px 0 0;font-size:14.5px;line-height:1.55;color:var(--ink)}
.hcard .hk{font-family:var(--f-label);font-size:10px;letter-spacing:.15em;color:var(--gold)}
.hcard .big{margin:8px 0 6px;font-family:var(--f-display);font-weight:700;font-size:clamp(28px,3.4vw,40px);line-height:1;color:var(--cream)}
.hcard .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.hcard .btn.big{padding:13px 20px;font-size:15px}
.hcard.hero{border-color:rgba(232,176,92,.5);background:radial-gradient(90% 120% at 0% 0%,rgba(232,145,46,.16),transparent 70%),rgba(255,255,255,.02)}
.hcard.hero.t-no{border-color:var(--line);background:rgba(255,255,255,.02)}
.hcard.status{border-color:rgba(155,224,138,.35)}
.hcard.warn{border-color:rgba(159,195,255,.35);background:rgba(159,195,255,.04)}
.hcard.bad{border-color:rgba(255,106,90,.4);background:rgba(255,106,90,.05)}
.hcard.good{border-color:rgba(155,224,138,.4);background:rgba(155,224,138,.04)}
.hcard .maria{margin-top:10px;font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.25;color:var(--cream)}
.hcard .mute{color:var(--mute)}
.hcard.tier .big{font-size:26px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:10px;font-size:14px}
.kv span{color:var(--mute)} .kv b{color:var(--cream);font-weight:600;word-break:break-word}
.htbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.htbl th{text-align:left;font-family:var(--f-label);font-weight:400;font-size:9.5px;letter-spacing:.13em;color:var(--mute);padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
.htbl td{padding:9px 10px 9px 0;border-bottom:1px solid rgba(255,196,107,.08);color:var(--ink);vertical-align:top}
.htbl td:first-child{color:var(--cream)}
.htbl .v-good{color:var(--green);font-weight:600} .htbl .v-bad{color:var(--red);font-weight:600} .htbl .v-mid{color:var(--gold)}
.timeline{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:t}
.timeline li{position:relative;padding:12px 12px 12px 14px;border-left:2px solid var(--amber);background:rgba(255,196,107,.03);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.45;color:var(--ink)}
.timeline b{display:block;margin-bottom:4px;color:var(--cream);font-size:14px}
.hlist{margin:8px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14.5px;line-height:1.5}
@media (max-width: 900px){
  .hub-win{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  .hub-win nav{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .hub-win nav button{flex-shrink:0;padding:8px 10px;font-size:13px}
  .hgrid,.hgrid.three,.timeline{grid-template-columns:1fr}
}
@media (max-width: 760px){
  #hub{padding:0}
  .hub-win{height:100%;border-radius:0;border:0}
  .hub-win header{padding:max(14px,env(safe-area-inset-top)) 16px 12px}
  .hub-win header h2{font-size:34px}
  #hubBody{padding:14px 14px 110px}
  #talk .card{padding:18px 16px 14px;min-height:0}
  #talk .card>img{display:none}
  #talk #talkText{font-size:clamp(18px,5vw,23px)}
  .rules{grid-template-columns:1fr}
}
#proto{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));font-size:11px;color:var(--mute);letter-spacing:.06em;pointer-events:none}

#dock{z-index:5;position:fixed;left:50%;transform:translateX(-50%);bottom:max(30px,calc(env(safe-area-inset-bottom) + 18px));display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(6px)}
#dock button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:76px;padding:8px 10px;border:0;border-radius:11px;background:transparent;font-size:12.5px;color:var(--ink)}
#dock button svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.6}
#dock button:hover,#dock button.on{background:rgba(255,196,107,.1)}
#dock button.main{background:linear-gradient(180deg,#f2a347,#c9701d);color:#1b1006;font-weight:600}
#dock button.main svg{stroke:#1b1006}
#dock button:focus-visible,.btn:focus-visible,.chip:focus-visible,.x:focus-visible,#meter:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#feed{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:120px;width:min(340px,calc(100vw - 32px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.msg{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:13.5px;animation:in .5s ease both}
.msg img{width:28px;height:28px;border-radius:50%;flex-shrink:0;object-fit:cover}
.msg .who{font-family:var(--f-label);font-size:9.5px;letter-spacing:.12em;color:var(--gold);display:block;margin-bottom:1px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

#online{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:120px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
#online .p{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 6px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:12.5px}
#online .p i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--amber)}

#panel{z-index:3;position:fixed;top:72px;right:max(16px,env(safe-area-inset-right));bottom:110px;width:min(420px,calc(100vw - 32px));border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(8px);display:none;flex-direction:column;overflow:hidden}
#panel.open{display:flex}
#panel header{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
#panel header img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--line-2)}
#panel header h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1;letter-spacing:.02em;color:var(--cream);text-wrap:balance}
#panel header p{margin:3px 0 0;font-size:12.5px;color:var(--mute)}
.x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:18px;line-height:1;flex-shrink:0}
#pbody{overflow:auto;padding:14px 18px 18px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;flex:1;min-height:0}
#pbody h3{font-family:var(--f-label);font-weight:400;font-size:10.5px;letter-spacing:.14em;color:var(--gold);margin:18px 0 8px}
#pbody h3:first-child{margin-top:2px}
.say{padding:12px 14px;border-left:2px solid var(--gold);background:rgba(255,196,107,.06);border-radius:0 10px 10px 0;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:11px;border:1px solid var(--line-2);background:rgba(255,196,107,.06);font-size:14px;color:var(--ink);text-decoration:none}
.btn:hover{background:rgba(255,196,107,.13)}
.btn.main{background:linear-gradient(180deg,#f2a347,#c9701d);border-color:transparent;color:#1b1006;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:transparent;margin-bottom:8px}
.opt:hover{border-color:var(--line-2);background:rgba(255,196,107,.05)}
.opt b{display:block;color:var(--cream);font-weight:600}
.opt span{font-size:13px;color:var(--mute)}
.consent{padding:14px;border:1px solid var(--line-2);border-radius:12px;background:rgba(0,0,0,.25);font-size:14px}
.consent p{margin:0 0 8px}
.consent .fund{color:var(--gold);font-weight:600}
.parts{display:grid;gap:8px}
.part{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.part > div{min-width:0}
.part svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.5}
.part b{display:block;font-weight:600;font-size:14px}
.part span{font-size:12.5px;color:var(--mute)}

// what the browser can tell about this computer: the card it draws with, threads, system
function machine() {
  const ua = navigator.userAgent, raw = SOFT ? '' : GPU_NAME;
  const m = raw.match(/(NVIDIA GeForce [^(,)]+|NVIDIA RTX [^(,)]+|NVIDIA [^(,)]*(?:Quadro|Tesla|A\d{3,4})[^(,)]*|AMD Radeon[^(,)]*|Radeon[^(,)]*|Apple M\d[^(,)]*|Intel\(R\)[^(,)]+|Intel [^(,)]*Graphics[^(,)]*)/i);
  const gpu = m ? m[1].replace(/\s*\(0x[0-9a-f]+\)/ig, '').replace(/\s+Direct3D.*$/i, '').replace(/\s+/g, ' ').trim() : '';
  const os = /Android/i.test(ua) ? 'Android' : /iPhone|iPad|iPod/i.test(ua) ? 'iOS' : /Mac/i.test(ua) ? 'macOS' : /Win/i.test(ua) ? 'Windows' : /Linux|X11/i.test(ua) ? 'Linux' : 'your system';
  const phone = os === 'Android' || os === 'iOS';
  const threads = navigator.hardwareConcurrency || 0;
  const v = /nvidia/i.test(gpu) ? 'nvidia' : /amd|radeon/i.test(gpu) ? 'amd' : /apple m/i.test(gpu) ? 'apple' : /intel/i.test(gpu) ? 'intel' : 'unknown';
  const rtx = /RTX\s*(20|30|40|50)\d\d/i.test(gpu) || /RTX\s*A?\d{4}/i.test(gpu);
  let tier, verdict, backend;
  if (phone) { tier = 'no'; backend = '—'; verdict = "A phone can't carry this work. Come back from a computer: your plot on the ring will wait."; }
  else if (v === 'nvidia') { backend = 'GPU'; tier = rtx ? 'good' : 'ok'; verdict = rtx ? 'A CUDA card. The miner puts it straight to work.' : 'An older NVIDIA card. It can join; it will be slower.'; }
  else if (v === 'apple') { backend = 'Auto'; tier = 'good'; verdict = 'Apple Silicon. The miner has a build for it.'; }
  else if (v === 'amd') { backend = 'Auto'; tier = 'ok'; verdict = 'Radeon works in some epochs and is rougher than NVIDIA. Auto mode lets the miner decide.'; }
  else { backend = 'Auto'; tier = 'cpu'; verdict = SOFT ? "Your browser hides the graphics card from me, so I'll plan for the processor. If there is an NVIDIA card inside, the miner will find it anyway." : "I don't see a card I'd mine on, so the processor does the work. Auto mode picks AVX2 or AVX-512 by itself."; }
  const name = gpu.replace(/^NVIDIA GeForce /i, '').replace(/^AMD /i, '');
  return { gpu, seen: !!gpu, vendor: v, os, phone, threads, tier, verdict, backend, hw: (name || 'CPU') + (threads ? ` · ${threads} threads` : '') };
}

const PHASES = ['Renting', 'Deploying', 'Connecting', 'Warming up', 'Mining'];
function runBuild() {
  const step = REDUCED ? 1600 : 2600;
  const tick = async () => {
    const cur = me(); if (!cur) return; const phase = (cur.phase || 0) + 1;
    if (phase <= 3) { await saveMe({ phase }); if (panelKind === 'house') openHouse(cur.id); setTimeout(tick, step); return; }
    await saveMe({ phase: 4, state: 'mining' });
    banner('ANNA · LINKED', `${cur.hw.toUpperCase()} → THE CORE`); say("I won't forget."); pulse(1.3); setTimeout(() => pulse(0.8), 900);
    record(`${cur.nick}'s rig is mining: ${cur.hw}, ${cur.sol.toLocaleString('en-US')} sol/h est.`);
    record(`${cur.nick} received: Epoch seal E${EPOCH}, Hardware card ${cur.hw.replace(/^\d+× /, '')}`);
    if (panelKind === 'house') openHouse(cur.id);
    setTimeout(() => say(S.town.B >= 0 ? 'Feel that? The ring grew. The town holds a little better because you came.' : 'Better, but the frost still wins. It needs more of us: tend the fire, help someone on the board.'), 2500);
  };
  setTimeout(tick, step);
}

function briefing() {
  let prev = null; try { prev = JSON.parse(store.get('w4w.seen') || 'null'); } catch {}
  setTimeout(() => { if (!seenSaved) { seenSaved = true; saveSeen(); setInterval(saveSeen, 60e3); } }, 4000);
  if (!prev || !prev.t) return false;
  const since = prev.t, t = S.town, lines = [];
  const mins = Math.round((Date.now() - since) / 60000); const ago = mins < 90 ? `${mins} minutes` : mins < 2880 ? `${Math.round(mins / 60)} hours` : `${Math.round(mins / 1440)} days`;
  const fresh = Object.values(S.real).filter(h => (h.createdAt || 0) > since && h.id !== S.uid).map(h => h.nick);
  const kept = Object.values(S.orders).filter(o => (o.doneAt || 0) > since);
  const fire = Object.values(S.real).filter(h => (h.lastWood || 0) > since && h.id !== S.uid).map(h => h.nick);
  const notes = (S.notices || []).filter(n => n.at > since && n.by !== S.uid);
  if (fresh.length) lines.push(`${fresh.slice(0, 3).join(', ')}${fresh.length > 3 ? ` and ${fresh.length - 3} more` : ''} settled in town.`);
  if (kept.length) lines.push(`${kept.length} ${kept.length === 1 ? 'promise was' : 'promises were'} kept on the board${kept[0].takerNick ? `: ${kept[0].takerNick} helped ${kept[0].byNick}` : ''}.`);
  if (fire.length) lines.push(`${fire.slice(0, 3).join(', ')} fed the plaza fire.`);
  if (notes.length) lines.push(`${notes.length} new ${notes.length === 1 ? 'notice' : 'notices'} on the board.`);
  const dm = Math.round((t.melt - (prev.melt || 0)) * 100); if (dm > 0) lines.push(`Anna's ice gave way by ${dm}%. It is ${Math.round(t.melt * 100)}% thawed now.`);
  lines.push(t.B >= 0 ? `The town holds tonight: warmth ${Math.round(t.W)} against frost ${Math.round(t.F)}.` : `The frost is winning tonight: warmth ${Math.round(t.W)} against frost ${Math.round(t.F)}. We need you at the fire.`);
  const text = `You were away ${ago}. ${lines.length > 1 ? 'While you were gone: ' : ''}${lines.join(' ')}`;

}

function bank(q) {
  const s = ' ' + q.toLowerCase() + ' '; let best = null, score = 0;

  if (!best) return { text: sample ? "I don't have that written down. I can think it through if you want." : "I don't have that written down. Ask me about Anna, the frost, rigs, orders or the Library." };
  return { text: best[0](), go: best[1] };
}
